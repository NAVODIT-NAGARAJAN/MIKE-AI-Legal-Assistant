[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
    --strict-markers
markers =
    unit: Unit tests (no database or HTTP required)
    integration: Integration tests (require running app + database)
